displayName="Nova Mekanism"
displayURL="https://github.com/falcon2235/nova-mekanism"
authors="falcon2235"
credits="Recipes and structures inspired by GregTech CEu and GregTech: New Horizons."
description='''Nova Mekanism is a massive end-game expansion for Mekanism. It adds GregTech-inspired parallel-processing multiblocks (up to 300x), full ore-processing chains (titanium, nickel, special steel, platinum group, naquadah), and a long progression of chemical, alloy and energy multiblocks — electric & alloy blast furnaces, vacuum freezer, distillation tower, large chemical reactor, mixer, electrolyzer, centrifuge, circuit assembly line, fusion reactor, artificial star generator and a chunk-sized black hole stabilizer — culminating in trans-dimensional materials and a craftable Creative Energy Cube. Includes a construction terminal that auto-builds any of these structures.'''

